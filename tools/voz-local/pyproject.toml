[project]
name = "enova-voz-local"
version = "0.1.0"
description = "Voz clonada no próprio computador (Chatterbox Multilingual, licença MIT) para o E-Nova"
requires-python = ">=3.11,<3.12"
dependencies = [
  "chatterbox-tts==0.1.7",
  "torch==2.6.0",
  "torchaudio==2.6.0",
  "setuptools<81",  # o marcador de áudio (perth) ainda usa pkg_resources
]

# PyTorch com suporte à placa NVIDIA (CUDA 12.4). Sem placa, o mesmo pacote roda na CPU (mais devagar).
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.uv]
package = false
